[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-periodogram"
version = "0.1.0"
description = "Neural-network false-alarm probabilities and periodograms for astronomical time series"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Niall J. Miller", email = "niall.j.miller@gmail.com"}]
requires-python = ">=3.9"
keywords = ["astronomy", "time series", "periodogram", "variable stars", "false alarm probability", "neural network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.22", "torch>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib"]
convert = ["h5py"]
astropy = ["astropy"]
test = ["pytest", "h5py", "scikit-learn", "astropy"]
docs = ["sphinx", "furo", "myst-parser", "matplotlib"]

[project.urls]
Homepage = "https://nialljmiller.com/projects/NN_Periodogram/"
Source = "https://github.com/nialljmiller/NN_Periodogram"
Issues = "https://github.com/nialljmiller/NN_Periodogram/issues"

[tool.setuptools.packages.find]
include = ["nn_periodogram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
