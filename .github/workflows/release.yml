# Builds the sdist/wheel on every GitHub release and uploads it to PyPI.
# Uses the PYPI_API_TOKEN repository secret if it is set (as in SED_Tools and SED_Model);
# otherwise PyPI trusted publishing (a publisher for project nn-periodogram, workflow
# release.yml, environment pypi).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
